# Manual tools: check the data feed, or re-run the strategy backtest.
# A backtest writes strategy/selected.json and reports/backtest.md. A running evaluation
# keeps the strategy it started with; a new selection only applies to a future evaluation.
name: Research
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task"
        required: true
        type: choice
        options:
          - check-data
          - backtest
          - backtest-momentum
permissions:
  contents: write
concurrency:
  group: research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        timeout-minutes: 10
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        timeout-minutes: 10
      - name: Run
        run: |
          set -o pipefail
          python -m papertrader ${{ inputs.task }} 2>&1 | tee out.log
          { echo '## Output'; echo '```'; tail -n 120 out.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save backtest results
        if: inputs.task != 'check-data'
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy reports/backtest*.md reports/backtest*_results.json
          git commit -m "research: backtest results [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 3; done
